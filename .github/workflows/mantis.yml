name: Mantis Regression Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  mantis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: waqquuu/Mantis@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          mode: 'both'
