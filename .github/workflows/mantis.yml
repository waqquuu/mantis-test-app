name: Mantis Regression Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  mantis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mantis
        run: |
          pip install -r requirements.txt
          pip install .

      - name: Write API key
        run: echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > .env

      - name: Run Mantis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANTIS_MODE: 'both'
          MANTIS_DEPTH: '2'
          MANTIS_TIMEOUT: '120'
          MANTIS_POST_COMMENT: 'true'
        run: python mantis/action_runner.py
