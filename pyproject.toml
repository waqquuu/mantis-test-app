[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis"
version = "0.1.0"
description = "Catch regressions in pull requests by testing the blast radius of code changes"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "pytest>=7.0.0",
    "requests>=2.28.0",
]

[project.scripts]
mantis = "mantis.cli:main"

[tool.setuptools.packages.find]
include = ["mantis*"]
